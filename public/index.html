<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>jhbserver — Home-Lab Portal & Status</title>
</head>
<body>
  <header>
    <div>
      <h1>jhbserver — Self-Hosted Home-Lab</h1>
      <div class="sub" id="updated">Loading telemetry...</div>
    </div>
    <nav class="nav-links">
      <a href="https://joaohb07.github.io/documentation/" target="_blank" rel="noreferrer" class="primary">Documentation ↗</a>
      <a href="https://github.com/joaohb07" target="_blank" rel="noreferrer">GitHub ↗</a>
    </nav>
  </header>

  <div class="grid" id="host-cards"></div>

  <h2>Hosted Applications & Endpoint Latency</h2>
  <table>
    <thead>
      <tr>
        <th>Service</th>
        <th>Route</th>
        <th>Status</th>
        <th>Last Deploy</th>
        <th>HTTP</th>
        <th>Latency</th>
      </tr>
    </thead>
    <tbody id="probes"></tbody>
  </table>

  <h2>Docker Containers</h2>
  <table>
    <thead>
      <tr>
        <th>Container</th>
        <th>Image</th>
        <th>State</th>
        <th>CPU</th>
        <th>Memory</th>
        <th>Uptime / Status</th>
      </tr>
    </thead>
    <tbody id="containers"></tbody>
  </table>

  <script src="/js/app.js"></script>
</body>
</html>
