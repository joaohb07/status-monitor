<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jhbserver — Home-Lab Portal & Status</title>
  <style>
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #161616; color: #f4f4f4; margin: 0; padding: 2rem; max-width: 1100px; margin-inline: auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid #393939; padding-bottom: 1.25rem; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: 1.5rem; }
    .sub { color: #a8a8a8; font-size: 0.85rem; margin-top: 0.25rem; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .nav-links a { text-decoration: none; color: #f4f4f4; background: #262626; border: 1px solid #393939; padding: 0.5rem 0.9rem; border-radius: 4px; font-size: 0.85rem; font-weight: 500; transition: border-color 0.15s, background 0.15s; }
    .nav-links a:hover { border-color: #78a9ff; background: #333333; }
    .nav-links a.primary { background: #0f62fe; border-color: #0f62fe; }
    .nav-links a.primary:hover { background: #0353e9; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: #262626; border: 1px solid #393939; padding: 1.25rem; border-radius: 4px; }
    .label { font-size: 0.72rem; color: #a8a8a8; text-transform: uppercase; letter-spacing: 0.06em; }
    .value { font-size: 1.55rem; font-weight: 500; margin-top: 0.4rem; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; color: #c6c6c6; margin-bottom: 0.75rem; }
    table { width: 100%; border-collapse: collapse; background: #262626; margin-bottom: 2rem; border: 1px solid #393939; }
    th, td { text-align: left; padding: 0.85rem 1rem; border-bottom: 1px solid #393939; font-size: 0.9rem; }
    th { background: #1f1f1f; font-size: 0.75rem; text-transform: uppercase; color: #a8a8a8; }
    td a { color: #78a9ff; text-decoration: none; font-weight: 500; }
    td a:hover { text-decoration: underline; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .up { background: #0e6027; color: #a7f0ba; }
    .down { background: #750e13; color: #ffb3b8; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>jhbserver — Self-Hosted Home-Lab</h1>
      <div class="sub" id="updated">Loading telemetry...</div>
    </div>
    <nav class="nav-links">
      <a href="/task-app/">Task App ↗</a>
      <a href="/weather-app/">Weather App ↗</a>
      <a href="https://joaohb07.github.io/documentation/" target="_blank" rel="noreferrer" class="primary">Documentation ↗</a>
      <a href="https://github.com/joaohb07" target="_blank" rel="noreferrer">GitHub ↗</a>
    </nav>
  </header>

  <div class="grid" id="host-cards"></div>

  <h2>Hosted Applications & Endpoint Latency</h2>
  <table>
    <thead><tr><th>Service</th><th>Route</th><th>Status</th><th>HTTP</th><th>Latency</th></tr></thead>
    <tbody id="probes"></tbody>
  </table>

  <h2>Docker Containers</h2>
  <table>
    <thead><tr><th>Container</th><th>Image</th><th>State</th><th>Uptime / Status</th></tr></thead>
    <tbody id="containers"></tbody>
  </table>

  <script>
    async function refresh() {
      const res = await fetch('/api/status');
      const data = await res.json();
      const hrs = Math.floor(data.host.uptimeSec / 3600);
      const mins = Math.floor((data.host.uptimeSec % 3600) / 60);
      document.getElementById('updated').textContent = `Ubuntu Server • Last updated: ${new Date(data.timestamp).toLocaleTimeString()} • Auto-refresh: 5s`;

      document.getElementById('host-cards').innerHTML = `
        <div class="card"><div class="label">CPU Load (1m / 5m / 15m)</div><div class="value">${data.host.loadAvg.join(' / ')}</div></div>
        <div class="card"><div class="label">Memory Usage</div><div class="value">${data.host.memory.percent}% (${data.host.memory.usedGb}/${data.host.memory.totalGb} GB)</div></div>
        <div class="card"><div class="label">Host Uptime</div><div class="value">${hrs}h ${mins}m</div></div>
        <div class="card"><div class="label">CPU Temp</div><div class="value">${data.host.tempC ? data.host.tempC + ' °C' : 'N/A'}</div></div>
      `;

      document.getElementById('probes').innerHTML = data.probes.map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.publicPath ? `<a href="${p.publicPath}">${p.publicPath} ↗</a>` : '<span style="color:#8d8d8d">Internal</span>'}</td>
          <td><span class="badge ${p.up ? 'up' : 'down'}">${p.up ? 'ONLINE' : 'DOWN'}</span></td>
          <td>${p.statusCode || '-'}</td>
          <td>${p.latencyMs !== null ? p.latencyMs + ' ms' : '-'}</td>
        </tr>
      `).join('');

      document.getElementById('containers').innerHTML = data.containers.map(c => `
        <tr>
          <td><strong>${c.name}</strong></td>
          <td style="font-family:monospace;font-size:0.82rem">${c.image}</td>
          <td><span class="badge ${c.state === 'running' ? 'up' : 'down'}">${c.state}</span></td>
          <td>${c.status}</td>
        </tr>
      `).join('');
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
